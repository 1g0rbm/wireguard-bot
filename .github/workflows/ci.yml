name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: true

      - name: Trust mise config
        run: mise trust --yes

      - name: Install tools
        run: mise install

      - name: Run linter
        run: mise run lint

      - name: Run tests
        run: mise run test
